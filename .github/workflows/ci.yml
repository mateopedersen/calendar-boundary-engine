name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-smoke:
    name: Node.js source smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Import and exercise public API
        run: node --experimental-strip-types --input-type=module -e 'import { toIsoWeekDate, createMonthGrid, gregorianToJdn } from "./src/mod.ts"; const week = toIsoWeekDate({year:2027,month:1,day:1}); const grid = createMonthGrid({year:2027,month:1,fixedWeeks:true}); if (week.weekYear !== 2026 || week.week !== 53 || grid.cells.length !== 42 || gregorianToJdn({year:2000,month:1,day:1}) !== 2451545) throw new Error("smoke test failed");'
  quality:
    name: Quality (${{ matrix.os }}, TZ=${{ matrix.tz }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        tz: [UTC, Pacific/Kiritimati]
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Format
        run: deno fmt --check
      - name: Lint
        run: deno lint
      - name: Type check
        run: deno check src/mod.ts tests/*.ts examples/*.ts benchmarks/*.ts
      - name: Tests
        run: deno test
      - name: Documentation lint
        run: deno doc --lint src/mod.ts
      - name: JSR publication dry run
        run: deno publish --dry-run
